name: Castle Management Build Check

on:
  push:
    branches:
      - feature/castle-management-first-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand

      - name: Run Android backend configuration tests
        working-directory: frontend
        run: npm run test:android-config

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_SUPABASE_URL: https://spujitkyideoalrdjlbq.supabase.co
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
          REACT_APP_BACKEND_URL: https://demonanic.onrender.com
        run: npm run build:android

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Demonanic-castle-management-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
